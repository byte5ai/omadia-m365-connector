schema_version: "1"

identity:
  id: "@omadia/integration-microsoft365"
  name: "Microsoft 365 Connector"
  version: "0.2.2"
  kind: "integration"
  domain: "m365"
  description: "Gemeinsamer Microsoft-Graph-Layer (Bot-Framework App-Registration) für alle Microsoft-365-Konsumenten. Stellt den Kernel-Service 'microsoft365.graph' (Microsoft365Accessor) bereit — konsumiert vom Teams-Channel und den Kalender-Tools."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "integration"
    - "communication"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

setup:
  guide:
    en: |
      ## Get Microsoft 365 credentials

      Register an app in **Microsoft Entra ID** (Azure AD) and grant Microsoft
      Graph permissions. You need three values: **Tenant ID**, **App (Client)
      ID**, **App (Client) Secret**. This app is also reused by the Teams channel.

      ### 1. Register the app
      1. [Azure Portal](https://portal.azure.com) → **Microsoft Entra ID** →
         **App registrations** → **New registration** → name it → **Register**.
      2. **Overview** → copy **Directory (tenant) ID** → field **Azure AD Tenant ID**.
      3. **Overview** → copy **Application (client) ID** → field **App (Client) ID**.

      ### 2. Client secret
      **Certificates & secrets** → **New client secret** → copy the **Value**
      immediately (not shown again) → field **App (Client) Secret**.

      ### 3. Graph permissions
      1. **API permissions** → **Add a permission** → **Microsoft Graph** →
         **Application permissions**.
      2. Add what your use case needs (e.g. `Calendars.Read`, `Mail.Read`,
         `User.Read.All`, `Files.Read.All`).
      3. Click **Grant admin consent for <Tenant>** (requires an admin).

      > App-only (client-credentials) flow: no user sign-in, access is
      > tenant-wide within the granted permissions.
    de: |
      ## Microsoft-365-Credentials beschaffen

      Registriere eine App in **Microsoft Entra ID** (Azure AD) und vergib
      Microsoft-Graph-Berechtigungen. Du brauchst drei Werte: **Tenant ID**,
      **App (Client) ID**, **App (Client) Secret**. Diese App nutzt auch der
      Teams-Channel.

      ### 1. App registrieren
      1. [Azure Portal](https://portal.azure.com) → **Microsoft Entra ID** →
         **App registrations** → **New registration** → benennen → **Register**.
      2. **Overview** → **Directory (tenant) ID** kopieren → Feld **Azure AD Tenant ID**.
      3. **Overview** → **Application (client) ID** kopieren → Feld **App (Client) ID**.

      ### 2. Client-Secret
      **Certificates & secrets** → **New client secret** → den **Value** sofort
      kopieren (wird nicht erneut angezeigt) → Feld **App (Client) Secret**.

      ### 3. Graph-Berechtigungen
      1. **API permissions** → **Add a permission** → **Microsoft Graph** →
         **Application permissions**.
      2. Je nach Use-Case hinzufügen (z.B. `Calendars.Read`, `Mail.Read`,
         `User.Read.All`, `Files.Read.All`).
      3. **Grant admin consent for <Tenant>** klicken (Admin-Rechte nötig).

      > App-Only-Flow (Client-Credentials): keine Benutzer-Anmeldung, Zugriff gilt
      > mandantenweit im Rahmen der erteilten Berechtigungen.
  fields:
    - key: "microsoft_tenant_id"
      type: "string"
      label: "Azure AD Tenant ID"
      help: "GUID der Tenant-Registration, z.B. 11111111-2222-3333-4444-555555555555."
      required: true
      pattern: "^[0-9a-fA-F-]{36}$"
    - key: "microsoft_app_id"
      type: "string"
      label: "App (Client) ID"
      help: "GUID der Bot-Framework App-Registration."
      required: true
      pattern: "^[0-9a-fA-F-]{36}$"
    - key: "microsoft_app_password"
      type: "secret"
      label: "App (Client) Secret"
      help: "Rotierbar im Azure Portal → App Registration → Certificates & secrets."
      required: true

playbook:
  when_to_use: |
    Wird implizit installiert, wenn ein Microsoft-365-Konsument (Teams-
    Channel, Calendar-Agent, zukünftig Mail / OneDrive) installiert wird.
    Endanwender adressieren dieses Paket nicht direkt — es liefert die
    geteilten Graph-Clients via Service-Registry.

permissions:
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound:
      - "login.microsoftonline.com"
      - "graph.microsoft.com"
  filesystem:
    scratch: false

integrations:
  - id: "ms_graph"
    kind: "http"
    target: "Microsoft Graph API (App-Credentials + OBO-Token-Flow)"
    auth_from: "microsoft_app_password"
    docs: "https://learn.microsoft.com/graph/api/overview"
