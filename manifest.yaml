schema_version: "1"

identity:
  id: "@omadia/integration-microsoft365"
  name: "Microsoft 365 Connector"
  version: "0.5.2"
  kind: "integration"
  domain: "m365"
  description: "Gemeinsamer Microsoft-Graph-Layer (Bot-Framework App-Registration) für alle Microsoft-365-Konsumenten. Stellt den Kernel-Service 'microsoft365.graph' (Microsoft365Accessor) bereit — konsumiert vom Teams-Channel und den Kalender-Tools."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "integration"
    - "communication"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

# Builder service-type auto-discovery — see integration-odoo for the full
# rationale. Registers `microsoft365.graph` into the agent-builder's
# serviceTypeRegistry on activation so a builder-generated agent can
# `external_reads` against the Graph accessor without a middleware restart.
service_types:
  - service: "microsoft365.graph"
    type:
      from: "@omadia/integration-microsoft365"
      name: "Microsoft365Accessor"
  # teamsProvisioner@1 (epic byte5ai/omadia#860) — per-agent Teams bot
  # provisioning (Entra app + Azure bot + app package + catalog + team
  # install). The registry key is the BARE name; the versioned form lives in
  # `provides:` below. Consumed by the middleware agent factory.
  - service: "teamsProvisioner"
    type:
      from: "@omadia/integration-microsoft365"
      name: "TeamsProvisionerAccessor"

# Capability announcement for the resolver — the versioned manifest ref of
# the `teamsProvisioner` service above (two-constant split, see
# src/teamsProvisioner/types.ts).
provides:
  - "teamsProvisioner@1"

setup:
  guide:
    en: |
      ## Get Microsoft 365 credentials

      Register an app in **Microsoft Entra ID** (Azure AD) and grant Microsoft
      Graph permissions. You need three values: **Tenant ID**, **App (Client)
      ID**, **App (Client) Secret**. This app is also reused by the Teams channel.

      ### 1. Register the app
      1. [Azure Portal](https://portal.azure.com) → **Microsoft Entra ID** →
         **App registrations** → **New registration** → name it → **Register**.
      2. **Overview** → copy **Directory (tenant) ID** → field **Azure AD Tenant ID**.
      3. **Overview** → copy **Application (client) ID** → field **App (Client) ID**.

      ### 2. Client secret
      **Certificates & secrets** → **New client secret** → copy the **Value**
      immediately (not shown again) → field **App (Client) Secret**.

      ### 3. Graph permissions
      1. **API permissions** → **Add a permission** → **Microsoft Graph** →
         **Application permissions**.
      2. Add what your use case needs (e.g. `Calendars.Read`, `Mail.Read`,
         `User.Read.All`, `Files.Read.All`).
      3. Click **Grant admin consent for <Tenant>** (requires an admin).

      For the Teams provisioning capability (`teamsProvisioner@1`) additionally
      add: `Application.ReadWrite.OwnedBy`, `AppCatalog.ReadWrite.All`,
      `TeamsAppInstallation.ReadWriteForTeam.All`.

      Extending an existing app registration requires **renewed admin consent**:
      click **Grant admin consent for <Tenant>** again. If Graph still
      answers 403 afterwards, grant the app roles via REST `appRoleAssignments`
      and restart the middleware — portal/CLI consent sometimes silently fails
      to apply.

      > App-only (client-credentials) flow: no user sign-in, access is
      > tenant-wide within the granted permissions.
    de: |
      ## Microsoft-365-Credentials beschaffen

      Registriere eine App in **Microsoft Entra ID** (Azure AD) und vergib
      Microsoft-Graph-Berechtigungen. Du brauchst drei Werte: **Tenant ID**,
      **App (Client) ID**, **App (Client) Secret**. Diese App nutzt auch der
      Teams-Channel.

      ### 1. App registrieren
      1. [Azure Portal](https://portal.azure.com) → **Microsoft Entra ID** →
         **App registrations** → **New registration** → benennen → **Register**.
      2. **Overview** → **Directory (tenant) ID** kopieren → Feld **Azure AD Tenant ID**.
      3. **Overview** → **Application (client) ID** kopieren → Feld **App (Client) ID**.

      ### 2. Client-Secret
      **Certificates & secrets** → **New client secret** → den **Value** sofort
      kopieren (wird nicht erneut angezeigt) → Feld **App (Client) Secret**.

      ### 3. Graph-Berechtigungen
      1. **API permissions** → **Add a permission** → **Microsoft Graph** →
         **Application permissions**.
      2. Je nach Use-Case hinzufügen (z.B. `Calendars.Read`, `Mail.Read`,
         `User.Read.All`, `Files.Read.All`).
      3. **Grant admin consent for <Tenant>** klicken (Admin-Rechte nötig).

      Für die Teams-Provisionierung (`teamsProvisioner@1`) zusätzlich hinzufügen:
      `Application.ReadWrite.OwnedBy`, `AppCatalog.ReadWrite.All`,
      `TeamsAppInstallation.ReadWriteForTeam.All`.

      Erweiterte Berechtigungen einer bestehenden App-Registration erfordern
      **erneuten Admin-Consent**: **Grant admin consent for <Tenant>**
      erneut klicken. Antwortet Graph danach weiterhin mit 403, die App-Rollen
      per REST `appRoleAssignments` zuweisen und die Middleware neu starten —
      Portal-/CLI-Consent greift manchmal stillschweigend nicht.

      > App-Only-Flow (Client-Credentials): keine Benutzer-Anmeldung, Zugriff gilt
      > mandantenweit im Rahmen der erteilten Berechtigungen.
  fields:
    - key: "microsoft_tenant_id"
      type: "string"
      label: "Azure AD Tenant ID"
      help: "GUID der Tenant-Registration, z.B. 11111111-2222-3333-4444-555555555555."
      required: true
      pattern: "^[0-9a-fA-F-]{36}$"
    - key: "microsoft_app_id"
      type: "string"
      label: "App (Client) ID"
      help: "GUID der Bot-Framework App-Registration."
      required: true
      pattern: "^[0-9a-fA-F-]{36}$"
    - key: "microsoft_app_password"
      type: "secret"
      label: "App (Client) Secret"
      help: "Rotierbar im Azure Portal → App Registration → Certificates & secrets."
      required: true
    # --- teamsProvisioner@1: OPTIONAL ARM fields ---------------------------
    # Verbatim from TEAMS_PROVISIONER_ARM_SETUP_FIELDS in
    # src/teamsProvisioner/config.ts (arm-config unit). ALL optional: absence
    # degrades the capability to registration-only mode (no automatic Azure
    # bot creation) — it never breaks activation or existing installs.
    - key: "azure_subscription_id"
      type: "string"
      label: "Azure Subscription ID"
      help: "GUID der Azure-Subscription, in der die Azure-Bot-Ressourcen angelegt werden. Leer lassen für Registration-only-Modus (kein automatisches Bot-Provisioning)."
      required: false
      pattern: "^[0-9a-fA-F-]{36}$"
    - key: "azure_resource_group"
      type: "string"
      label: "Azure Resource Group"
      help: "Name der Resource Group für Microsoft.BotService/botServices. Leer lassen für Registration-only-Modus."
      required: false
      pattern: "^[-A-Za-z0-9_.()]{1,90}$"
    - key: "azure_region"
      type: "string"
      label: "Azure Region"
      help: "ARM-Location der Bot-Ressourcen, für Azure Bot Services üblicherweise 'global'. Leer lassen für Registration-only-Modus."
      required: false
      pattern: "^[a-z0-9]{2,32}$"
    - key: "azure_sp_client_id"
      type: "string"
      label: "ARM Service Principal Client ID"
      help: "Client-ID eines dedizierten Service Principals für management.azure.com. Leer lassen, um die Bot-Framework-App (App (Client) ID + Secret) für ARM wiederzuverwenden."
      required: false
      pattern: "^[0-9a-fA-F-]{36}$"
    - key: "azure_sp_client_secret"
      type: "secret"
      label: "ARM Service Principal Client Secret"
      help: "Client-Secret des dedizierten ARM Service Principals. Leer lassen, um das App (Client) Secret der Bot-Framework-App wiederzuverwenden."
      required: false

playbook:
  when_to_use: |
    Wird implizit installiert, wenn ein Microsoft-365-Konsument (Teams-
    Channel, Calendar-Agent, zukünftig Mail / OneDrive) installiert wird.
    Endanwender adressieren dieses Paket nicht direkt — es liefert die
    geteilten Graph-Clients via Service-Registry.

permissions:
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound:
      - "login.microsoftonline.com"
      - "graph.microsoft.com"
      # teamsProvisioner@1 — ARM REST (Microsoft.BotService). Without this
      # entry the Azure-bot step's egress is denied.
      - "management.azure.com"
  filesystem:
    scratch: false
  # teamsProvisioner@1 — the app-registration step persists each generated
  # bot app password into THIS plugin's vault namespace
  # (`teams_bot_password:<appId>`, see src/teamsProvisioner/secretStore.ts)
  # and returns only the opaque secretRef across the service boundary.
  # Requires the write-capable ctx.secrets (Spec 004).
  secrets:
    runtime_write: true

integrations:
  - id: "ms_graph"
    kind: "http"
    target: "Microsoft Graph API (App-Credentials + OBO-Token-Flow)"
    auth_from: "microsoft_app_password"
    docs: "https://learn.microsoft.com/graph/api/overview"
  - id: "azure_arm_botservice"
    kind: "http"
    target: "Azure Resource Manager (Microsoft.BotService, teamsProvisioner@1 — optional, Registration-only-Modus ohne ARM-Konfiguration)"
    auth_from: "azure_sp_client_secret"
    docs: "https://learn.microsoft.com/rest/api/botservice/"
